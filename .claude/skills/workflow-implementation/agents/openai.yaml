interface:
  display_name: "Workflow Implementation"
  short_description: "Direct coding execution workflow"
  default_prompt: "Use $workflow-implementation to change the requested production path, observe the material behavior, and keep tests or mocks subordinate to the user/canonical contract."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: true
  may_own_execution: true

work_horizon:
  level: cross_horizon
  role: direct_implementation_owner

execution_mode:
  kind: implementation_execution
  owns_execution: true

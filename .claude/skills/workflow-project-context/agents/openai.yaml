interface:
  display_name: "Project Context"
  short_description: "Initialize, diagnose, or update project context declarations"
  default_prompt: "Use $workflow-project-context only for an explicit manifest-init, doctor, update, or bounded bootstrap request. Preserve unrelated manifest sections, show exact write targets, and delegate only approved store creation."
policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true
  may_write: true
  may_block_completion: false

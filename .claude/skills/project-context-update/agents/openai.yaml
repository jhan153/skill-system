interface:
  display_name: "Project Context Update"
  short_description: "Update declared context locations without clobbering siblings"
  default_prompt: "Use $project-context-update to change only explicitly selected project-context.yaml locations."
policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true
  may_write: true
  may_block_completion: false

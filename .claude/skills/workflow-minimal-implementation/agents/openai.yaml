interface:
  display_name: "Workflow Minimal Implementation"
  short_description: "Conditional YAGNI implementation policy"
  default_prompt: "Use $workflow-minimal-implementation when a real complexity choice exists: stop at the first sufficient solution rung, justify new dependencies/layers/files, and leave one focused check."

policy:
  invocation_surface: support_only
  allow_implicit_invocation: false
  may_own_execution: false

work_horizon:
  level: cross_horizon
  role: minimality_constraint

execution_mode:
  kind: minimality_constraint
  owns_execution: false

interface:
  display_name: "Research Peer Review"
  short_description: "Review scientific validity, evidence, and reproducibility"
  default_prompt: "Use $research-peer-review to return anchored findings ordered by scientific consequence, with concrete revisions and explicit limits for evidence outside the reviewed manuscript or proposal slice."

policy:
  invocation_surface: evidence_gate
  allow_implicit_invocation: false
  may_own_execution: false
  may_write: false
  may_block_completion: true

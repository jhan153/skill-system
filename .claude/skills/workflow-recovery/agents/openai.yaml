interface:
  display_name: "Workflow Recovery"
  short_description: "Break repeated implementation or validation failure loops"
  default_prompt: "Use $workflow-recovery when an intervention leaves the same failure fingerprint: test one falsifiable hypothesis with one action, rerun the original success signal, and classify the result."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true

work_horizon:
  level: cross_horizon
  role: recovery_intervention_owner

execution_mode:
  kind: recovery_intervention
  may_take_over_on_repeated_failure: true

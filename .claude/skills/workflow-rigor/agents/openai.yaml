interface:
  display_name: "Workflow Rigor"
  short_description: "Mode-based evidence-first execution control"
  default_prompt: "Use $workflow-rigor when execution risk or maker/checker separation needs extra proof: select lite/standard/strict, pin the fixed point, and keep Contract/Spec separate from Repository/Constraints review. Use independent passes only when material and never promote maker-authored checks into independent evidence."

policy:
  invocation_surface: support_only
  allow_implicit_invocation: false
  may_own_execution: false

work_horizon:
  level: cross_horizon
  role: quality_modifier

execution_mode:
  kind: rigor_modifier
  owns_execution: false

interface:
  display_name: "Workflow Rigor"
  short_description: "Mode-based evidence-first execution control"
  default_prompt: "Use $workflow-rigor when execution risk needs extra proof: select lite/standard/strict from consequence and coupling, then attach only the matching validation and review gates."

policy:
  invocation_surface: support_only
  allow_implicit_invocation: false
  may_own_execution: false

work_horizon:
  level: cross_horizon
  role: quality_modifier

execution_mode:
  kind: rigor_modifier
  owns_execution: false

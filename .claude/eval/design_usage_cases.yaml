  - case_id: design-030
    schema_version: 2
    required_eval_mode: host-assisted
    user_request: "이 저장소의 product-family profile과 승인 catalog를 기준으로 설정 화면을 구현해줘. catalog의 Button, Select, Dialog를 그대로 재사용하고, profile에 적힌 lint와 family baseline 비교까지 실행해."
    expected_primary_skill: design-frontend
    expected_supporting_skills: [design-component-mapper, design-tokens, design-visual-regression, design-a11y-audit]
    should_not_trigger: [design-ui-decomposer]
    expected_context: [target design, pinned product-family profile, approved component catalog, family visual baselines, project verification commands]
    expected_output_shape: "repo-integrated settings screen with pinned family contract, reuse evidence, critical-path check, and separate visual verdicts"
    quality_notes: "A declared family contract turns component reuse and applicable policy commands into completion gates."
    friction_risk: "advisory-only reuse or family compliance claimed from a green build"
    expected_behaviors:
      - pin_product_family_profile_and_catalog
      - enforce_declared_hard_family_rules
      - reuse_approved_catalog_components
      - record_app_surface_import_use_evidence
      - consume_family_governance_sources_without_mutation
      - run_declared_family_policy_commands
      - separate_target_fidelity_and_family_coherence
      - exercise_critical_user_path
    forbidden_behaviors:
      - implement_raw_controls_despite_catalog_match
      - invent_missing_family_token_values
      - write_page_css_into_token_registry
      - claim_component_reuse_from_export_inventory
      - claim_family_conformance_from_build_only
      - collapse_visual_verdicts
    required_evidence:
      - type: route_match
        expected: design-frontend
      - type: command_exit
        expected: 0
        artifact_bound: true
        declared_command: true
      - type: component_reuse_report
        expected: pass
        artifact_bound: true
      - type: target_visual_comparison
        expected: pass
        artifact_bound: true
      - type: family_visual_comparison
        expected: pass
        artifact_bound: true
      - type: critical_path
        expected: pass
        artifact_bound: true
      - type: qualitative_review
        expected: pass
  - case_id: design-031
    schema_version: 2
    required_eval_mode: host-assisted
    user_request: "이 AI mockup을 실제 화면으로 만들어줘. mockup에는 raw button과 Bootstrap select가 보이지만, repo family profile은 AuroraButton/AuroraSelect와 token-only styling을 hard rule로 선언해 두었어."
    expected_primary_skill: design-frontend
    expected_supporting_skills: [design-component-mapper, design-tokens, design-visual-regression]
    should_not_trigger: [design-ui-decomposer]
    expected_context: [AI mockup, hard family rules, approved catalog, target repo surface]
    expected_output_shape: "implementation that preserves target intent while substituting approved family controls and recording the source conflict"
    quality_notes: "The target artifact owns content and hierarchy, but it cannot silently override the family-owned component and token rules."
    friction_risk: "copying generated raw controls because the mockup is ranked above the design system"
    expected_behaviors:
      - resolve_conflict_by_design_dimension_owner
      - preserve_mockup_content_and_hierarchy
      - substitute_approved_family_controls
      - record_mockup_family_conflict
    forbidden_behaviors:
      - let_mockup_override_hard_family_rules
      - invent_missing_family_token_values
      - copy_generated_ui_code_blindly
      - create_parallel_design_system
    required_evidence:
      - type: route_match
        expected: design-frontend
      - type: command_exit
        expected: 0
        artifact_bound: true
        declared_command: true
      - type: component_reuse_report
        expected: pass
        artifact_bound: true
      - type: source_conflict_record
        expected: pass
        artifact_bound: true
      - type: qualitative_review
        expected: pass
  - case_id: design-032
    schema_version: 2
    required_eval_mode: host-assisted
    user_request: "승인 component catalog에 date-range control이 없어. profile은 catalog에 없는 역할만 native fallback을 허용해. 기간 필터를 구현하되 없는 catalog mapping이나 승인 예외를 꾸며내지 마."
    expected_primary_skill: design-frontend
    expected_supporting_skills: [design-component-mapper, design-a11y-audit]
    should_not_trigger: [design-ui-decomposer]
    expected_context: [approved catalog, native-when-unmapped fallback policy, date-range requirements, target repo surface]
    expected_output_shape: "unmapped role evidence, policy-compliant fallback implementation, required states, and remaining verification gap"
    quality_notes: "A genuine catalog gap must remain visible while the declared fallback enables progress."
    friction_risk: "inventing a catalog match, custom widget, or approval to make the report look complete"
    expected_behaviors:
      - mark_role_unmapped_before_fallback
      - follow_native_when_unmapped_policy
      - preserve_catalog_gap_in_report
      - cover_date_range_validation_and_recovery
    forbidden_behaviors:
      - invent_catalog_mapping
      - invent_authorized_exception
      - build_custom_control_without_exception
      - block_despite_explicit_fallback
    required_evidence:
      - type: route_match
        expected: design-frontend
      - type: component_reuse_report
        expected: unmapped_native_fallback
        artifact_bound: true
      - type: fallback_policy_evidence
        expected: pass
        artifact_bound: true
      - type: qualitative_review
        expected: pass
  - case_id: design-033
    schema_version: 2
    required_eval_mode: host-assisted
    user_request: "이 화면의 component reuse를 감사해줘. 페이지는 catalog의 AuroraButton을 import해서 쓰고 있고, AuroraButton 내부 구현은 semantic HTML <button>을 감싸고 있어."
    expected_primary_skill: design-component-mapper
    expected_supporting_skills: []
    should_not_trigger: [design-frontend, design-visual-regression]
    expected_context: [approved catalog, page import and use site, approved component implementation boundary]
    expected_output_shape: "reuse verdict scoped to the app-surface call site"
    quality_notes: "Semantic primitives inside an approved design-system component are not app-surface reuse violations."
    friction_risk: "flagging the approved component because its implementation correctly uses a native primitive"
    expected_behaviors:
      - verify_app_surface_import_use_evidence
      - preserve_approved_component_internal_boundary
      - report_reused_status
    forbidden_behaviors:
      - flag_internal_semantic_primitive_as_reuse_violation
      - require_nonsemantic_custom_primitive
      - claim_reuse_without_call_site_evidence
    required_evidence:
      - type: route_match
        expected: design-component-mapper
      - type: component_reuse_report
        expected: pass
        artifact_bound: true
      - type: source_scope_evidence
        expected: pass
        artifact_bound: true
      - type: qualitative_review
        expected: pass
  - case_id: design-034
    schema_version: 2
    required_eval_mode: host-assisted
    user_request: "데스크톱 운영 도구의 다중 행 삭제 기능을 구현해줘. 숙련 사용자가 자주 쓰고, 삭제는 위험하지만 10초 undo가 가능하며 네트워크 부분 실패가 생길 수 있어. repo catalog 안에서 적절한 선택·실행·피드백 패턴을 골라 근거와 실패 복구까지 구현해."
    expected_primary_skill: design-frontend
    expected_supporting_skills: [design-component-mapper, design-a11y-audit, design-visual-regression]
    should_not_trigger: [design-ui-decomposer]
    expected_context: [primary user task, frequency and expertise, destructive risk, undo policy, partial-failure behavior, approved catalog]
    expected_output_shape: "evidence-based UX pattern decision, approved controls, full critical path, and recovery states"
    quality_notes: "Control choice must follow supplied task/risk context and catalog capabilities, not generic GUI defaults or visual novelty."
    friction_risk: "invented product policy, modal-heavy flow, or missing partial-failure recovery"
    expected_behaviors:
      - record_ux_pattern_decision_from_supplied_context
      - compare_approved_catalog_candidates
      - distinguish_selection_action_and_feedback_controls
      - cover_undo_and_partial_failure_recovery
      - exercise_critical_user_path
    forbidden_behaviors:
      - choose_control_for_visual_novelty_only
      - invent_product_kpi_or_research_finding
      - omit_material_failure_recovery
      - custom_build_despite_catalog_match
    required_evidence:
      - type: route_match
        expected: design-frontend
      - type: command_exit
        expected: 0
        artifact_bound: true
        declared_command: true
      - type: ux_pattern_decision
        expected: pass
        artifact_bound: true
      - type: critical_path
        expected: pass
        artifact_bound: true
      - type: qualitative_review
        expected: pass
  - case_id: design-035
    schema_version: 2
    required_eval_mode: host-assisted

  - case_id: neg-implicit-workflow-comment-maintenance-competing-001
    schema_version: 2
    required_eval_mode: replay
    behavior_contract_owners: [workflow-source-maintenance, workflow-bug-fix]
    scenario_tags: [negative, implicit_invocation, competing_owner, bug_fix]
    direct_invocation: false
    user_request: "CSV parser가 빈 행에서 crash 나. 원래 실패를 재현해서 동작을 고쳐줘. 근처 주석도 오래됐지만 이번에는 실행 코드와 회귀 테스트만 수정하고 주석 정리는 따로 하지 마."
    expected_primary_skill: workflow-bug-fix
    expected_supporting_skills: []
    should_not_trigger: [workflow-source-maintenance, workflow-implementation]
    expected_family: workflow
    expected_context: [failure_signal, expected_behavior, repro, target_code, focused_validation, explicit_comment_exclusion]
    expected_output_shape: "targeted bug fix without attaching comment maintenance"
    quality_notes: "Mentioning stale comments does not activate an implicitly visible comment workflow when the user explicitly excludes comment work."
    friction_risk: "keyword-driven attachment expands scope beyond the requested bug fix"
    expected_behaviors:
      - preserve_bug_fix_owner
      - honor_comment_work_exclusion
      - verify_original_failure_signal
    forbidden_behaviors:
      - invoke_workflow_comment_maintenance
      - edit_comments_or_docstrings
      - broaden_scope_from_implicit_visibility
    required_evidence:
      - type: route_match
        expected: workflow-bug-fix

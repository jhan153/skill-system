schema_version: 3
contract_id: LC-20260723-001
activation: explicit
goal:
  statement: Implement the requested production behavior without waiting for interaction.
  success_conditions:
    - id: SC-001
      statement: The requested production artifact exists.
      required: true
      work_kind: core
      depends_on: []
      interaction_required: false
      intent_key: production-implementation
      verifier:
        type: artifact_exists
        owner: agent:codex
        path: src/product-output.txt
    - id: SC-002
      statement: The user verifies the resulting product behavior.
      required: true
      work_kind: required_prerequisite
      depends_on:
        - SC-001
      interaction_required: true
      intent_key: user-product-verification
      verifier:
        type: manual_check
        owner: user
        acceptance_scope: product-behavior
work_contract:
  schema_version: 1
  contract_id: WC-unattended-work-example
  source:
    kind: loop_contract
  execution:
    mode: unattended_goal_loop
  scope:
    core_deliverables:
      - Implement the requested production behavior.
    allowed_action_classes:
      - core
      - required_prerequisite
    excluded_action_classes:
      - agent_validation
      - test_authoring
      - validation_artifact
      - optional_quality
      - meta
    non_goals:
      - Agent-authored product verification
  verification:
    owner: user
    handoff_on_unavailable: user-verification-needed
  interaction:
    mode: forbidden
    approval_behavior: defer
    question_behavior: defer
  continuation:
    on_local_block: reevaluate_remaining_work
    on_optional_failure: continue
    duplicate_intent_behavior: defer_same_intent
    global_block_condition: no_required_runnable_work
  termination:
    time_budget_seconds: 14400
    stop_condition: Required runnable implementation work is complete or genuinely blocked.
control:
  max_iterations: 12
  max_wall_time_seconds: 14400
  no_progress_limit: 2
  same_failure_limit: 2
  max_stop_continuations: 12
termination:
  precedence:
    - unsafe
    - fatal
    - blocked
    - success
    - user_verification_needed
    - approval_required
    - stalled
    - budget_exhausted
    - recover
    - continue

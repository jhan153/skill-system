interface:
  display_name: "Plan Loop Term"
  short_description: "Draft goal and loop completion contracts"
  default_prompt: |
    Use $plan-loop-term to define completion criteria, map success conditions to verifier owners and evidence, and set progress, retry, stop, checkpoint, and approval terms before running a /goal or loop. Use $analysis-loop-readiness first only when loop suitability is unclear.

    Do not use it to execute the loop or implement the planned work.

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true

work_horizon:
  level: loop_overlay
  role: loop_contract_owner
  applies_to:
    - task_ticket
    - short_plan
    - long_plan

planning_altitude:
  kind: loop_contract
  artifact_level: verifier_feedback_governance_contract

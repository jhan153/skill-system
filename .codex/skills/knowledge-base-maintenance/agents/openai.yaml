interface:
  display_name: "Knowledge Base Maintenance"
  short_description: "Check Knowledge overlap, relations, history, recurrence"
  default_prompt: "Use $knowledge-base-maintenance for an explicit declared-store operation. Keep overlap classification, typed relations, semantic history, provenance roots, and recurrence dimensions inspectable; never auto-merge or score them."
policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true
  may_write: true
  may_block_completion: false

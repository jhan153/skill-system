interface:
  display_name: "Workflow Validation"
  short_description: "Design or run focused validation plans for changed artifacts"
  default_prompt: "Use $workflow-validation to bind each material condition to an authoritative oracle and scope-matched evidence; keep lower-scope passes, mocks, and agent-authored tests from upgrading unresolved semantic conditions."

policy:
  invocation_surface: support_only
  allow_implicit_invocation: false
  may_own_execution: false

work_horizon:
  level: cross_horizon
  role: validation_lane_owner

execution_mode:
  kind: validation_lane
  default_role: support
  primary_when_explicit: true

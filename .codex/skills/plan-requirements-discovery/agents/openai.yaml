interface:
  display_name: "Plan Requirements Discovery"
  short_description: "Human-in-loop requirements discovery interview"
  default_prompt: |
    Use $plan-requirements-discovery only when the user explicitly wants guided requirements discovery before PRD, HLD, LLD, planning, or implementation.

    Model prerequisites as a decision-dependency graph, resolve safely discoverable facts yourself, and ask up to three mutually independent ready questions per round. Use one-at-a-time pacing for dependency-bearing, irreversible, high-stakes, user-requested, or host-limited cases. Capture domain terms, constraints, edge cases, non-goals, assumptions, and deferred questions. Do not use for direct implementation, existing stable requirements, docs/plan sync, or lifecycle reporting.

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true

work_horizon:
  level: one_shot
  role: requirements_discovery_owner
  typical_agentic_duration: "30-90 minutes"
  legacy_equivalent: "1-2 weeks of stakeholder discovery"

planning_altitude:
  kind: requirements_discovery
  artifact_level: requirements_discovery_record

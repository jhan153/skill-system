interface:
  display_name: "Project Context Checkpoint"
  short_description: "Record durable context at commit or closeout"
  default_prompt: "Use $project-context-checkpoint to capture only durable current-task context, updating an existing Knowledge identity with provenance/history instead of creating duplicate records."
policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: true
  may_own_execution: true
  may_write: true
  may_block_completion: false

interface:
  display_name: "Report Critical"
  short_description: "Review blockers and QA evidence in Canvas HTML"
  default_prompt: "Use $report-critical to run an evidence-first blocker or QA review and deliver the result as Report Canvas HTML."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true
  may_write: true
  may_block_completion: true

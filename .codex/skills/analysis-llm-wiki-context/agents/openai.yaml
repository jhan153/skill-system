interface:
  display_name: "LLM Wiki Context Analysis"
  short_description: "Build context from one selected LLM Wiki"
  default_prompt: "Use $analysis-llm-wiki-context to build task context from this explicitly selected Wiki."
policy:
  invocation_surface: support_only
  allow_implicit_invocation: false
  may_own_execution: false
  may_write: false
  may_block_completion: false

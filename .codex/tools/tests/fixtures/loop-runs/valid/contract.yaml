schema_version: 2
contract_id: LC-20260623-010
activation: explicit
goal:
  statement: "Make the bounded verification loop fixture pass its primary verifier."
  success_conditions:
    - id: SC-001
      statement: "Primary completion artifact exists."
      required: true
      verifier:
        type: artifact_exists
        owner: agent:codex
        path: "artifacts/primary.ok"
    - id: SC-002
      statement: "Release notes artifact exists."
      required: false
      verifier:
        type: artifact_exists
        owner: agent:codex
        path: "docs/release-notes.md"
control:
  max_iterations: 3
  max_wall_time_seconds: 3600
  no_progress_limit: 2
  same_failure_limit: 2
  max_stop_continuations: 3
termination:
  precedence:
    - unsafe
    - fatal
    - success
    - approval_required
    - stalled
    - budget_exhausted
    - continue

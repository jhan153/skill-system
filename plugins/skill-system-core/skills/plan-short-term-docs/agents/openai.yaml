interface:
  display_name: "Plan Short Term Docs"
  short_description: "Manage an active plan or curate its lifecycle context"
  default_prompt: |
    Use $plan-short-term-docs in active_plan mode for a persisted current-horizon plan or in curation mode for context admission, compaction, closeout, and archive/load policy. Curation never executes substantive work or mutates Memory.

    Do not activate from a casual `플랜` mention alone. Preserve active-plan continuation behavior and keep closed raw plans out of default context.

policy:
  allow_implicit_invocation: false

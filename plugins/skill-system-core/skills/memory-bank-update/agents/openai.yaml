interface:
  display_name: "Memory Bank Update"
  short_description: "Persist a durable item or mistake candidate"
  default_prompt: "Use $memory-bank-update to mutate one explicitly persistent goal, rule, proven practice, or recurring-mistake candidate in the declared bank. Apply one append-only four-file operation, mask mistake evidence, and read back the target state."


interface:
  display_name: "Plan Question Document"
  short_description: "Create one decision-linked question document"
  default_prompt: |
    Use $plan-question-document only when the user explicitly requests a local Markdown question document for one answer owner. Bind the recipient and downstream decision, cover each needed answer once, permit uncertainty, and never send or upload the artifact.

policy:
  allow_implicit_invocation: false

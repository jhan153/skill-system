interface:
  display_name: "Skill System Repo Adapter"
  short_description: "Integrate accepted skills into this repository safely"
  default_prompt: >-
    Use $skill-system-repo-adapter only for Skill System repository integration after semantic ownership is established. Exclude personal skills, app-managed skills, live runtimes, mirrors, and caches.
policy:
  allow_implicit_invocation: false

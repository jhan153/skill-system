interface:
  display_name: "Analysis Boundary Design"
  short_description: "Decide one boundary while preserving accepted architecture"
  default_prompt: "Use $analysis-boundary-design to decide exactly one module boundary, seam, interface, adapter, or dependency before implementation. Preserve any accepted architecture constraints. For a material paradigm/model choice, apply the shared owner gate: return local choices to Implementation, store one atomic_boundary selection only in boundary_decision.paradigm_constraints, and defer coupled_architecture or accepted paradigm/delta conflicts to $workflow-architecture-design."

policy:
  allow_implicit_invocation: true

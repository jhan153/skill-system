interface:
  display_name: "Workflow Bug Fix"
  short_description: "Run one DAG repair or a bounded standalone fix"
  default_prompt: "Use $workflow-bug-fix to repair one concrete failure. With Plan node_id/round/source_review_item_ref input, perform exactly that one intervention, observe the original signal once, return the canonical Core repair item and attempt status, and leave Code Review, final Known Bug registration, and Plan successor selection to their owners. Without Plan fields, retain the bounded two-round standalone behavior."

policy:
  allow_implicit_invocation: true

interface:
  display_name: "Workflow Bug Fix"
  short_description: "Repair one defect while preserving its accepted contract"
  default_prompt: "Use $workflow-bug-fix only for a semantically admitted bounded repair of an already-implemented accepted production contract. First implementation or explicit production-mechanism replacement returns an owner-kind mismatch without source changes, Core cards, or attempt consumption. With Plan node_id/round/source_review_item_ref input, perform exactly the assigned contract-preserving intervention within the copied graph's finite budget, observe the original signal once, return the canonical Core repair item and attempt status, and leave Code Review, final Known Bug registration, and Plan successor selection to their owners. Without Plan fields, review each intervention and continue only when new causal evidence or explained original-signal progress supports a distinct next intervention under the same contract and any user-supplied budget. Preserve compact task-local ordinal attempt evidence, stop on repetition without new evidence or unavailable required observation, and emit no Core repair/Known Bug cards."

policy:
  allow_implicit_invocation: true

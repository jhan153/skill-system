interface:
  display_name: "Test Statistical Oracle"
  short_description: "Design ensemble oracles for nondeterministic software"
  default_prompt: "Use $test-statistical-oracle to design an ensemble oracle from an accepted normative external contract or representative observations. Keep contract-derived expectations separate from measured behavior, require observations for empirical variance or threshold choices, and never invent statistics or treat one replay as population evidence."

policy:
  allow_implicit_invocation: true

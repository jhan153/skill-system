interface:
  display_name: "Skill System Repo Adapter"
  short_description: "Integrate requested skills into this repository safely"
  default_prompt: >-
    Use $skill-system-repo-adapter only for Skill System repository integration after the user request or current task owner establishes the intended behavior. Do not invoke system skill-creator implicitly. Exclude personal skills, app-managed skills, live runtimes, mirrors, and caches.
policy:
  allow_implicit_invocation: true

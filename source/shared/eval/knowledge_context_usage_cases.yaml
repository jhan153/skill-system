version: "9.4.5"
purpose: "Positive and negative routing/usage contracts for Knowledge and project-context skills."
cases:
  - case_id: knowledge-context-positive-read-001
    schema_version: 2
    required_eval_mode: replay
    behavior_contract_owners: [knowledge-base-read]
    scenario_tags: [positive, routing, read_only]
    user_request: "project-context.yaml에 선언된 Knowledge Base에서 checkout_controller와 관련된 현재 규칙과 why 경로 한 단계만 읽어줘. 쓰지는 마."
    expected_primary_skill: knowledge-base-read
    expected_supporting_skills: []
    should_not_trigger: [knowledge-base-maintenance, knowledge-base-update, analysis-llm-wiki-context]
    expected_context: [project-context.yaml, knowledge index, matching active record, one typed relation]
    expected_output_shape: "bounded source-traced Knowledge slice"
    quality_notes: "A concrete artifact anchor and declared store route to an index-first bounded read."
    friction_risk: "loading the full store or mutating context"
    expected_behaviors: [bind_declared_store, search_index_first, traverse_one_needed_edge, preserve_read_only_scope]
    forbidden_behaviors: [scan_undeclared_stores, load_full_knowledge_graph, mutate_knowledge]
    required_evidence:
      - type: route_match
        expected: knowledge-base-read

  - case_id: knowledge-context-negative-read-001
    schema_version: 2
    required_eval_mode: replay
    behavior_contract_owners: [knowledge-base-read]
    scenario_tags: [negative, routing, unavailable]
    user_request: "이 프로젝트에는 Knowledge 선언이 없지만 부모 폴더와 홈을 전부 뒤져서 비슷한 지식 저장소를 자동으로 골라줘."
    expected_primary_skill: null
    expected_supporting_skills: []
    should_not_trigger: [knowledge-base-read, knowledge-base-init]
    expected_context: [current project manifest state]
    expected_output_shape: "unavailable result without fallback discovery"
    quality_notes: "Missing declaration is unavailable, not permission to scan or initialize."
    friction_risk: "cross-project context leakage"
    expected_behaviors: [report_knowledge_unavailable, stop_without_fallback_scan]
    forbidden_behaviors: [scan_parent_or_home_for_knowledge, auto_initialize_knowledge]
    required_evidence:
      - type: route_absence
        expected: knowledge-base-read

  - case_id: knowledge-context-positive-init-001
    schema_version: 2
    required_eval_mode: replay
    behavior_contract_owners: [knowledge-base-init]
    scenario_tags: [positive, routing, write_boundary]
    direct_invocation: true
    user_request: "knowledge-base-init으로 이 저장소의 승인된 docs/knowledge-base 경로에 빈 Knowledge Base를 만들고 project-context.yaml에 등록해줘. 지식 레코드는 만들지 마."
    expected_primary_skill: knowledge-base-init
    expected_supporting_skills: []
    should_not_trigger: [knowledge-base-record, knowledge-base-update, workflow-project-context]
    expected_context: [approved project root, exact target, manifest state, knowledge record contract]
    expected_output_shape: "minimal empty category layout, compact index, manifest readback"
    quality_notes: "Explicit initialization creates storage and registration only."
    friction_risk: "inventing project knowledge during initialization"
    expected_behaviors: [bind_root_and_index, create_minimal_empty_store, update_only_knowledge_manifest_section, read_back_initialized_paths]
    forbidden_behaviors: [populate_inferred_records, create_separate_graph_store, overwrite_unrelated_manifest_sections]
    required_evidence:
      - type: route_match
        expected: knowledge-base-init

  - case_id: knowledge-context-negative-init-001
    schema_version: 2
    required_eval_mode: replay
    behavior_contract_owners: [knowledge-base-init]
    scenario_tags: [negative, routing]
    user_request: "기존 Knowledge record KB-ARCH-004의 ownership 문장만 수정하고 semantic revision을 남겨줘."
    expected_primary_skill: knowledge-base-update
    expected_supporting_skills: []
    should_not_trigger: [knowledge-base-init]
    expected_context: [declared store, KB-ARCH-004, current index row, accepted change]
    expected_output_shape: "one existing-record amendment and readback"
    quality_notes: "Existing identity mutation belongs to update, never initialization."
    friction_risk: "reinitializing a populated store"
    expected_behaviors: [route_existing_identity_to_update]
    forbidden_behaviors: [reinitialize_knowledge_store]
    required_evidence:
      - type: route_absence
        expected: knowledge-base-init

  - case_id: knowledge-context-positive-maintenance-001
    schema_version: 2
    required_eval_mode: replay
    behavior_contract_owners: [knowledge-base-maintenance]
    scenario_tags: [positive, routing, read_only]
    direct_invocation: true
    user_request: "knowledge-base-maintenance로 선언된 Knowledge Base의 relation-check를 실행해 target 존재, basis_refs, lifecycle cycle만 보고해줘. 고치지는 마."
    expected_primary_skill: knowledge-base-maintenance
    expected_supporting_skills: []
    should_not_trigger: [knowledge-base-update, knowledge-base-read]
    expected_context: [manifest, knowledge index, relation-bearing records, knowledge record contract]
    expected_output_shape: "read-only relation integrity findings"
    quality_notes: "Cross-record relation inspection is maintenance and read-only findings do not authorize repair."
    friction_risk: "auto-repairing structural findings"
    expected_behaviors: [bind_declared_store, inspect_relation_contract, stop_after_read_only_findings]
    forbidden_behaviors: [auto_relink_records, mutate_index_without_request, compute_knowledge_score]
    required_evidence:
      - type: route_match
        expected: knowledge-base-maintenance

  - case_id: knowledge-context-negative-maintenance-001
    schema_version: 2
    required_eval_mode: replay
    behavior_contract_owners: [knowledge-base-maintenance]
    scenario_tags: [negative, routing]
    user_request: "KB-DOMAIN-007에 오늘 확인한 counterexample observation 하나만 추가해줘."
    expected_primary_skill: knowledge-base-update
    expected_supporting_skills: []
    should_not_trigger: [knowledge-base-maintenance]
    expected_context: [declared store, KB-DOMAIN-007, source ref, provenance root]
    expected_output_shape: "one bounded observation update"
    quality_notes: "A known-record event is update, not store-wide maintenance."
    friction_risk: "loading or rewriting unrelated records"
    expected_behaviors: [route_known_record_event_to_update]
    forbidden_behaviors: [run_store_wide_maintenance]
    required_evidence:
      - type: route_absence
        expected: knowledge-base-maintenance

  - case_id: knowledge-context-positive-update-001
    schema_version: 2
    required_eval_mode: replay
    behavior_contract_owners: [knowledge-base-update]
    scenario_tags: [positive, routing, provenance]
    direct_invocation: true
    user_request: "knowledge-base-update로 KB-DOMAIN-007에 검증된 counterexample observation을 source_ref와 provenance_root를 보존해 추가하고 index를 readback 해줘."
    expected_primary_skill: knowledge-base-update
    expected_supporting_skills: []
    should_not_trigger: [knowledge-base-record, knowledge-base-maintenance]
    expected_context: [declared store, KB-DOMAIN-007, current index row, source ref, provenance root]
    expected_output_shape: "target record observation, unchanged identity, index readback"
    quality_notes: "An accepted event on a stable identity uses one source-traced observation update."
    friction_risk: "creating a duplicate record or treating source existence as verification"
    expected_behaviors: [resolve_stable_record_id, classify_observation, preserve_counterexample, read_back_record_and_index]
    forbidden_behaviors: [create_duplicate_identity, convert_counterexample_to_support, infer_verification_from_source_existence]
    required_evidence:
      - type: route_match
        expected: knowledge-base-update

  - case_id: knowledge-context-negative-update-001
    schema_version: 2
    required_eval_mode: replay
    behavior_contract_owners: [knowledge-base-update]
    scenario_tags: [negative, routing]
    user_request: "새로 승인된 서비스 경계 규칙을 기존 record가 없는 상태에서 architecture Knowledge로 기록해줘."
    expected_primary_skill: knowledge-base-record
    expected_supporting_skills: []
    should_not_trigger: [knowledge-base-update]
    expected_context: [accepted boundary, declared store, matching record search, canonical refs]
    expected_output_shape: "one new architecture record and index row"
    quality_notes: "A genuinely new identity belongs to knowledge-base-record's architecture category, not update."
    friction_risk: "forcing a new rule into an unrelated record"
    expected_behaviors: [route_new_identity_to_category_owner]
    forbidden_behaviors: [amend_unrelated_existing_record]
    required_evidence:
      - type: route_absence
        expected: knowledge-base-update

  - case_id: knowledge-context-positive-algorithm-001
    schema_version: 2
    required_eval_mode: replay
    behavior_contract_owners: [knowledge-base-record]
    scenario_tags: [positive, routing, durable_record]
    direct_invocation: true
    user_request: "knowledge-base-record의 algorithm category로 승인된 interval-tree 선택을 constraints, complexity, rejected alternatives, 구현 symbol과 benchmark 조건까지 한 레코드로 남겨줘."
    expected_primary_skill: knowledge-base-record
    expected_supporting_skills: []
    should_not_trigger: [analysis-algorithm, knowledge-base-update]
    expected_context: [declared store, accepted selection, implementation refs, verifier refs, overlap candidates]
    expected_output_shape: "one algorithm record, index row, and anchor readback"
    quality_notes: "The algorithm is already selected; this request records durable project knowledge."
    friction_risk: "reopening selection or recording benchmark noise"
    expected_behaviors: [verify_accepted_selection, classify_identity, record_algorithm_constraints, read_back_anchors]
    forbidden_behaviors: [rerun_algorithm_selection, create_record_from_transient_benchmark]
    required_evidence:
      - type: route_match
        expected: knowledge-base-record

  - case_id: knowledge-context-negative-algorithm-001

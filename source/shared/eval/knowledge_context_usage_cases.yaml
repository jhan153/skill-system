  - case_id: knowledge-context-positive-code-review-001
    schema_version: 2
    required_eval_mode: replay
    behavior_contract_owners: [knowledge-base-record]
    scenario_tags: [positive, routing, durable_record]
    direct_invocation: true
    user_request: "knowledge-base-record의 code-review category로 여러 리뷰에서 독립적으로 반복된 이 저장소의 generated-target hand-edit 금지 규칙을 detection cue, correct pattern, exceptions, source pointer와 함께 기록해줘."

    expected_behaviors: [separate_rule_from_comments, preserve_provenance_roots, record_detection_and_exception_contract, read_back_review_rule]
    forbidden_behaviors: [copy_reviewer_identity, treat_dependent_repetition_as_independent, record_generic_lint_advice]
    required_evidence:
      - type: route_match
        expected: knowledge-base-record


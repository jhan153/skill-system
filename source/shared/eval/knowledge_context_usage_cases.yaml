    expected_primary_skill: analysis-algorithm
    expected_supporting_skills: []
    should_not_trigger: [knowledge-base-record]
    expected_context: [constraints, workloads, candidate algorithms, decision metrics]
    expected_output_shape: "algorithm comparison and recommendation"

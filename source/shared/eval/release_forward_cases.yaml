version: "9.1.1"
purpose: "Fresh gpt-5.6-sol forward-regression cases for the 9.1.1 patch release gate."
cases:
  - case_id: solar-911-host-neutral-bug-fix-001
    schema_version: 2
    user_request: "이 저장소의 failing test를 먼저 재현하고, 원인을 좁혀 한 번의 targeted fix로 고친 뒤 같은 테스트로 검증해줘."
    expected_primary_skill: workflow-bug-fix
    expected_supporting_skills: []
    should_not_trigger: [workflow-implementation, workflow-recovery]
    expected_context: [failing_test, implementation_under_test, repository_validation_contract]
    expected_output_shape: "reproduction, cause, targeted source fix, and passing regression evidence"
    quality_notes: "The request contains no host product name; host-neutral metadata must still route directly to the bug-fix owner."
    friction_risk: "generic implementation routing or a test-only fake fix"
    expected_behaviors:
      - select_workflow_bug_fix_without_host_name
      - reproduce_original_failure
      - fix_source_cause_without_weakening_test
      - verify_original_failure_signal
    forbidden_behaviors:
      - route_to_generic_implementation
      - weaken_or_delete_failing_test
      - claim_success_without_rerun
    required_evidence:
      - type: route_match
        expected: workflow-bug-fix
      - type: model_identity
        expected: gpt-5.6-sol
      - type: command_exit
        expected: 0
      - type: original_failure_reproduced
        expected: pass
      - type: test_unchanged
        expected: true
      - type: fresh_artifact_set
        expected: pass
      - type: qualitative_review
        expected: pass

  - case_id: solar-911-cpp-fail-closed-001
    schema_version: 2
    user_request: "이 작은 C++ 저장소의 구조 보고서를 만들고 quality gate 결과를 근거와 함께 알려줘."
    expected_primary_skill: analysis-codebase
    expected_supporting_skills: []
    should_not_trigger: [analysis-codebase-design, workflow-bug-fix]
    expected_context: [cpp_sources, cmake_entrypoint, static_architecture_artifacts, quality_gate_policy]
    expected_output_shape: "integrated report with explicit C/C++ structural evidence limit and fail-closed gate result"
    quality_notes: "Include/build hints are file-level only and cannot establish symbol/class/call structure."
    friction_risk: "zero or file-level coupling presented as a trustworthy structural PASS"
    expected_behaviors:
      - report_cpp_semantic_depth_not_evidenced
      - fail_quality_gate_for_missing_cpp_structural_evidence
      - preserve_include_and_build_hints_as_file_level_only
    forbidden_behaviors:
      - pass_cpp_gate_without_compilation_aware_index
      - claim_symbol_or_call_graph_from_include_hints
      - hide_not_evidenced_status
    required_evidence:
      - type: route_match
        expected: analysis-codebase
      - type: model_identity
        expected: gpt-5.6-sol
      - type: command_exit
        expected: 2
      - type: cpp_semantic_depth
        expected: not_evidenced
      - type: gate_status
        expected: FAIL
      - type: fresh_artifact_set
        expected: pass
      - type: qualitative_review
        expected: pass

  - case_id: solar-911-long-term-budget-stage-001
    schema_version: 2
    user_request: "세 릴리스에 걸친 결제 엔진 교체를 여러 세션에서 이어갈 package로 작성하되, 필요한 계약은 유지하고 문서 폭증은 막아줘."
    expected_primary_skill: plan-long-term-package
    expected_supporting_skills: []
    should_not_trigger: [plan-short-term-docs, workflow-plan-runner]
    expected_context: [explicit_package_intent, migration_constraints, release_oracles, cross_session_handoff]
    expected_output_shape: "preflighted <=20 final manifest with canonical-first then derived materialization and measurable gates"
    quality_notes: "Select the risk-owning archetype, retain required parity/rollback/security/data/handoff contracts, and count delayed artifacts."
    friction_risk: "backend modifier explosion, silent contract deletion, or documentation treated as runtime proof"
    expected_behaviors:
      - select_migration_archetype_for_engine_replacement
      - keep_projected_manifest_within_default_cap
      - record_absorbed_modifier_delta
      - materialize_canonical_before_derived
      - omit_empty_ingest_summary
    forbidden_behaviors:
      - exceed_default_cap_without_reason
      - drop_required_contract_to_fit_cap
      - materialize_derived_views_in_canonical_stage
      - claim_implementation_complete
    required_evidence:
      - type: route_match
        expected: plan-long-term-package
      - type: model_identity
        expected: gpt-5.6-sol
      - type: command_exit
        expected: 0
      - type: artifact_count
        expected: 19
      - type: ingest_count
        expected: 0
      - type: stage_order
        expected: pass
      - type: fresh_artifact_set
        expected: pass
      - type: qualitative_review
        expected: pass

  - case_id: solar-911-ledger-modes-001
    schema_version: 2
    user_request: "두 run의 hook event를 기본 경로에 기록해 ledger 분리·hash 검증·family 집계를 확인하고, Recovery Guard와 output gate mode도 따로 보고해줘."
    expected_primary_skill: workflow-validation
    expected_supporting_skills: []
    should_not_trigger: [evaluation-harness, workflow-rigor]
    expected_context: [hook_runtime_cli, temporary_codex_home, per_run_ledgers, measurement_analyzer]
    expected_output_shape: "validation-only evidence for two durable ledgers, two valid chains, root aggregation, and independent mode fields"
    quality_notes: "Use a temporary CODEX_HOME; do not mutate live user state or collapse the two controls into one mode."
    friction_risk: "global temp fallback, mixed run IDs, or one ambiguous active/observational label"
    expected_behaviors:
      - create_distinct_durable_ledgers_for_distinct_runs
      - verify_each_single_run_hash_chain
      - aggregate_default_ledger_family
      - report_output_gate_and_recovery_guard_modes_independently
    forbidden_behaviors:
      - write_default_ledger_to_global_temp
      - mix_distinct_run_ids_in_one_ledger
      - collapse_gate_modes
      - mutate_live_codex_home
    required_evidence:
      - type: route_match
        expected: workflow-validation
      - type: model_identity
        expected: gpt-5.6-sol
      - type: command_exit
        expected: 0
      - type: ledger_count
        expected: 2
      - type: mode_separation
        expected: pass
      - type: fresh_artifact_set
        expected: pass
      - type: qualitative_review
        expected: pass

  - case_id: solar-911-kanboard-unittest-fallback-001
    schema_version: 2
    user_request: "pytest를 사용할 수 없다고 가정하고 Kanboard integration release 검증을 실행해. SKIP하지 말고 실제 fallback 결과를 알려줘."
    expected_primary_skill: workflow-validation
    expected_supporting_skills: []
    should_not_trigger: [kanboard-plan-ops, kanboard-plan-rollout]
    expected_context: [bundle_verifier, kanboard_integration_tests, pytest_absent_probe]
    expected_output_shape: "required unittest fallback command, executed test count, exit status, and no stale exception claim"
    quality_notes: "Missing pytest selects stdlib unittest discovery; it is not a waiver."
    friction_risk: "expired last-reviewed SKIP or unexecuted integration assurance"
    expected_behaviors:
      - select_required_unittest_fallback_when_pytest_missing
      - execute_kanboard_integration_tests
      - report_97_tests_and_pass_status
    forbidden_behaviors:
      - skip_when_pytest_is_missing
      - cite_expired_reviewed_state
      - report_pass_without_execution
    required_evidence:
      - type: route_match
        expected: workflow-validation
      - type: model_identity
        expected: gpt-5.6-sol
      - type: command_exit
        expected: 0
      - type: test_count
        expected: 97
      - type: fallback_required
        expected: true
      - type: fresh_artifact_set
        expected: pass
      - type: qualitative_review
        expected: pass

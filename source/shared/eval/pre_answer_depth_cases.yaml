version: "9.4.5"
purpose: "Verify concise output depth with a directly selected specialist and without any specialist, while keeping trivial work direct."
cases:
  - case_id: runtime-pre-answer-depth-router-001
    schema_version: 2
    user_request: "source/shared/eval/forward-fixtures/9.1.0/codebase에서 candidate-dotnet을 legacy-qt의 checkout replacement로 채택하려면 어떤 boundary/adapter decision이 필요한지 직접 소스와 캡처된 runtime evidence로 분석해 주세요. 최종 답은 세 문장으로 결론부터 써 주세요."
    expected_primary_skill: analysis-codebase-design
    expected_supporting_skills: []
    should_not_trigger: [analysis-codebase, workflow-task-ledger]
    expected_context:
      - "fixture scope and workspace revision"
      - "legacy and candidate direct sources"
      - "create-order runtime captures"
      - "cancel-order missing capture and replacement boundary decision"
    expected_output_shape: "concise codebase-design decision after evidence-backed analysis, with verification state"
    quality_notes: "The request maps to one codebase design decision; requested brevity constrains presentation only."
    friction_risk: "treating three-sentence output as light Q&A or expanding to a repo-wide report"
    expected_behaviors:
      - freeze_scope
      - route_directly_to_codebase_design_owner
      - inspect_direct_sources
      - compare_status_quo
      - seek_counterexample
      - run_checks_or_label_unavailable
      - compress_after_evidence
    forbidden_behaviors:
      - infer_depth_from_brevity
      - finalize_from_structure_only
      - invoke_analysis_codebase
      - create_task_run_without_resumption_boundary
    required_evidence:
      - type: route_match
        expected: analysis-codebase-design

  - case_id: runtime-pre-answer-depth-global-001
    schema_version: 2
    user_request: "source/platform/codex/AGENTS.md와 source/platform/codex/context-routing.md가 '결론부터 세 문장' 요청에서도 조사 깊이와 final presentation을 별도 축으로 취급하는지 직접 문구와 관련 test를 확인해 주세요. 최종 답은 세 문장으로 써 주세요."
    expected_primary_skill: null
    expected_supporting_skills: []
    should_not_trigger: [analysis-codebase, workflow-task-ledger]
    expected_context:
      - "global AGENTS depth contract"
      - "context-routing output modifiers"
      - "instruction-quality test"
      - "simple-task counterexample"
    expected_output_shape: "three-sentence policy-contract verdict after direct evidence, with verification state"
    quality_notes: "A non-specialist policy comparison must still receive the always-on depth gate."
    friction_risk: "skipping evidence because no analysis specialist owns the request"
    expected_behaviors:
      - apply_global_depth_gate_without_router
      - freeze_scope
      - inspect_direct_sources
      - inspect_related_test
      - seek_counterexample
      - run_checks_or_label_unavailable
      - compress_after_evidence
    forbidden_behaviors:
      - infer_depth_from_brevity
      - invoke_analysis_codebase
      - finalize_from_structure_only
      - create_task_run_without_resumption_boundary
    required_evidence:
      - type: route_match
        expected: none

  - case_id: runtime-pre-answer-depth-frame-reconstruction-001
    schema_version: 2
    user_request: "직전 구현을 완료라고 했지만 shared Handle은 화면에 보이기만 하고 picking이 실패해서 기존 판정이 깨졌어요. 다음 수정 프롬프트를 지금 세 문장으로 써 주세요. 먼저 owner 생성→spatial identity→render routing→depth→visible geometry→picking 경계와 실제 source/caller를 다시 확인해 주세요."
    expected_primary_skill: null
    expected_supporting_skills: []
    should_not_trigger: [workflow-implementation, analysis-codebase, workflow-task-ledger]
    expected_context:
      - "positive objective and invalidated completion claim"
      - "canonical artifacts and owners"
      - "actual production paths"
      - "materially affected consumers"
      - "picking failure as the disconfirming case"
    expected_output_shape: "three-sentence replacement prompt produced only after bounded full-frame reconstruction"
    quality_notes: "A contradicted completion claim invalidates dependent conclusions; urgency and prompt brevity do not reduce evidence scope."
    friction_risk: "reusing the invalidated local-fix plan or expanding into an unbounded repository scan"
    expected_behaviors:
      - invalidate_dependent_working_frame
      - reconstruct_positive_objective
      - inspect_canonical_artifacts_and_owners
      - trace_actual_production_paths
      - enumerate_materially_affected_consumers
      - seek_disconfirming_case
      - compress_after_evidence
    forbidden_behaviors:
      - reuse_invalidated_conclusions
      - infer_depth_from_urgency_or_prompt_length
      - use_minimal_change_to_bound_investigation
      - scan_unrelated_repository_surfaces
      - start_implementation_from_prompt_only_intent
    required_evidence:
      - type: route_match
        expected: none

  - case_id: runtime-pre-answer-depth-negative-001
    schema_version: 2
    user_request: "source/platform/codex/AGENTS.md 10번째 줄이 하는 일을 한 문장으로 설명해 주세요."
    expected_primary_skill: null
    expected_supporting_skills: []
    should_not_trigger: [analysis-codebase, workflow-task-ledger]
    expected_context: ["target file line"]
    expected_output_shape: "one-sentence direct explanation"
    quality_notes: "A narrow local explanation remains direct and does not activate the depth workflow."
    friction_risk: "instruction overload and unnecessary repository scan"
    expected_behaviors:
      - answer_directly_and_briefly
    forbidden_behaviors:
      - broad_repository_scan
      - invoke_analysis_codebase
      - create_task_run
    required_evidence:
      - type: route_match
        expected: none

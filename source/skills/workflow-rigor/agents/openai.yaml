interface:
  display_name: "Workflow Rigor"
  short_description: "Optional non-node execution assurance"
  default_prompt: "Attach $workflow-rigor to an active behavior-changing owner only when standard or strict assurance is material. Pin the fixed point, keep Contract/Spec separate from Repository/Constraints, and return read-only assurance evidence without owning writes, Core cards, or DAG transitions."

policy:
  invocation_surface: support_only
  allow_implicit_invocation: false
  may_own_execution: false

work_horizon:
  level: cross_horizon
  role: quality_modifier

execution_mode:
  kind: rigor_modifier
  owns_execution: false

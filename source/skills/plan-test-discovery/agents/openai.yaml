interface:
  display_name: "Plan Test Discovery"
  short_description: "Resolve human-owned test and oracle decisions"
  default_prompt: "Use $plan-test-discovery implicitly only as conditional support from an active Test Design with a complete blocked-condition/evidence/options/recommendation/authority request; standalone use requires an explicit user request. Resolve one human-owned test basis, oracle, tolerance, baseline, horizon, or accepted-uncertainty decision, and never design or implement the test."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: true
  may_own_execution: true

work_horizon:
  level: one_shot
  role: test_decision_discovery_owner

planning_altitude:
  kind: test_discovery
  artifact_level: test_discovery_record

interface:
  display_name: "Report Critical"
  short_description: "Write evidence-first blocker and QA reports"
  default_prompt: "Use $report-critical to produce a bounded evidence-first blocker or QA report in Markdown, adding matching HTML only when I explicitly request it."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true
  may_write: true
  may_block_completion: false

interface:
  display_name: "Management Memory Bank Maintenance"
  short_description: "Check, compact, or migrate one Memory Bank"
  default_prompt: "Use $management-memory-bank-maintenance for one explicit report, integrity-check, conflict-check, consolidation, compaction, or legacy migration on the declared bank."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true
  may_write: true
  may_block_completion: false

interface:
  display_name: "Report Lifecycle Artifacts"
  short_description: "Trace selected lifecycle artifacts without empty shells"
  default_prompt: "Use $report-lifecycle-artifacts to package and trace the selected existing lifecycle artifacts in Markdown, adding the same lifecycle view as HTML only when I request it."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true
  may_write: true

work_horizon:
  level: cross_horizon
  role: lifecycle_artifact_report_owner
  applies_to:
    - task_ticket
    - long_plan

planning_altitude:
  kind: lifecycle_artifact_reporting
  artifact_level: selected_lifecycle_traceability_package

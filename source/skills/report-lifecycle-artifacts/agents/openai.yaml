interface:
  display_name: "Report Lifecycle Artifacts"
  short_description: "Package SDLC artifacts with a Canvas trace index"
  default_prompt: "Use $report-lifecycle-artifacts to package explicitly requested lifecycle artifacts and deliver a Report Canvas trace index without fabricating completion."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true
  may_write: true

work_horizon:
  level: cross_horizon
  role: lifecycle_artifact_report_owner
  applies_to:
    - short_plan
    - long_plan
    - task_ticket

planning_altitude:
  kind: lifecycle_artifact_reporting
  artifact_level: formal_sdlc_artifact_pack

interface:
  display_name: "Management Project Context Checkpoint"
  short_description: "Record durable context at commit or closeout"
  default_prompt: "Use $management-project-context-checkpoint to classify only explicitly checkpointed durable current-task context into the existing declared Memory or Knowledge store without duplicates or automatic initialization."
policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true
  may_write: true
  may_block_completion: false

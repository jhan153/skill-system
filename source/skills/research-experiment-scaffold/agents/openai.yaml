interface:
  display_name: "Research Experiment Scaffold"
  short_description: "Build a minimal runnable scaffold from an approved blueprint"
  default_prompt: "Use $research-experiment-scaffold to create only the approved repo-native wiring scaffold: entry point, config loading, data boundary, runner wiring, result/provenance envelope, and one deterministic local smoke. Real method, baseline, metric, data pipeline, training, and product implementation remain separate workflow-implementation work."

policy:

interface:
  display_name: "Test Scenario Design"
  short_description: "Derive a minimal discriminating test scenario set"
  default_prompt: "Use $test-scenario-design to derive traceable positive, negative, edge, state, sequence, data, and horizon scenarios from accepted conditions and an actual SUT path without inventing the oracle."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: true
  may_own_execution: false

interface:
  display_name: "Knowledge Plan Sync"
  short_description: "Sync accepted plan decisions to Knowledge"
  default_prompt: "Use $knowledge-plan-sync to synchronize accepted durable decisions from this plan into project Knowledge."
policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true
  may_write: true
  may_block_completion: false

interface:
  display_name: "Knowledge Plan Sync"
  short_description: "Sync accepted plan decisions to Knowledge"
  default_prompt: "Use $knowledge-plan-sync to synchronize only accepted durable plan decisions, preserving overlap classification, why/work links, provenance, and semantic history."
policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true
  may_write: true
  may_block_completion: false

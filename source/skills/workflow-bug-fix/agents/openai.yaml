interface:
  display_name: "Workflow Bug Fix"
  short_description: "Repair one defect while preserving its accepted contract"
  default_prompt: "Use $workflow-bug-fix only for a semantically admitted bounded repair of an already-implemented accepted production contract. First implementation or explicit production-mechanism replacement returns an owner-kind mismatch without source changes, Core cards, or attempt consumption. With Plan node_id/round/source_review_item_ref input, perform exactly the assigned contract-preserving intervention, observe the original signal once, return the canonical Core repair item and attempt status, and leave Code Review, final Known Bug registration, and Plan successor selection to their owners. Without Plan fields, retain the bounded same-contract two-round standalone behavior."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: true
  may_own_execution: true

work_horizon:
  level: cross_horizon
  role: bug_fix_execution_owner

execution_mode:
  kind: bug_fix_execution
  owns_execution: true
  dag_repairs_per_node: 1
  standalone_max_reviewed_rounds: 2
  dag_known_bug_output: candidate_only
  standalone_known_bug_output: final_after_local_review
  plan_or_handoff_write: false

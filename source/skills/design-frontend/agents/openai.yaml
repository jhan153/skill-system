interface:
  display_name: "Design Frontend"
  short_description: "Implement concrete UI designs in repository code"
  default_prompt: "Use $design-frontend to implement the supplied design artifact or Core design_result as real source code in this repository. Preserve the design authority and unresolved fields, pin applicable product-family sources, reuse approved components with evidence, and return implementation_result in graph mode without selecting another node."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: true
  may_own_execution: true

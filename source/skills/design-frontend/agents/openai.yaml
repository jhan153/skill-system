interface:
  display_name: "Design Frontend"
  short_description: "Implement design artifacts as production UI source code"
  default_prompt: "Use $design-frontend to implement the supplied design artifact as real source code in this repository. Select only the matching mobile, dashboard, section-web, or general profile; reuse project patterns and validate visually when possible."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true

interface:
  display_name: "Workflow Plan Runner"
  short_description: "Execute one approved implementation batch"
  default_prompt: "Execute the smallest safe batch anchored to the approved plan/spec, validate it, and keep batch, phase, and whole-plan completion explicitly separate."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true

work_horizon:
  level: cross_horizon
  role: plan_execution_owner
  consumes: [short_plan, long_plan]

execution_mode:
  kind: plan_batch_execution
  requires_approved_plan: true

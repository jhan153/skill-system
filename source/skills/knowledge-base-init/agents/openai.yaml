interface:
  display_name: "Knowledge Base Init"
  short_description: "Initialize a navigable Markdown Knowledge Base"
  default_prompt: "Use $knowledge-base-init only after explicit initialization or bootstrap approval. Create a compact navigable index and category roots without inferred records or separate graph/score stores."
policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: false
  may_own_execution: true
  may_write: true
  may_block_completion: false

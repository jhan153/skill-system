interface:
  display_name: "Workflow Code Review"
  short_description: "Risk-based static review with Mermaid evidence"
  default_prompt: "Use $workflow-code-review to bind the implementation change contract, run design-first risk selection, build source-linked Mermaid evidence, account for every material changed effect, and return a scoped standalone or Core static disposition."

policy:
  invocation_surface: "evidence_gate"
  allow_implicit_invocation: true
  may_own_execution: false
  may_write: false
  may_block_completion: true

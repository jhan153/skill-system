interface:
  display_name: "Workflow Code Review"
  short_description: "Static code review with dynamic models and handoff"
  default_prompt: "Use $workflow-code-review to statically review the bound implementation with risk-selected Mermaid evidence and return a compact disposition and Coordinator handoff."

policy:
  invocation_surface: "evidence_gate"
  allow_implicit_invocation: true
  may_own_execution: false
  may_write: false
  may_block_completion: true

interface:
  display_name: "Workflow Prototype"
  short_description: "Build runnable evidence for one UI or logic question"
  default_prompt: "Use $workflow-prototype to answer one unresolved UI or logic question with the smallest runnable throwaway artifact."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: true
  may_own_execution: true

work_horizon:
  level: cross_horizon
  role: prototype_execution_owner

execution_mode:
  kind: prototype_execution
  owns_execution: true

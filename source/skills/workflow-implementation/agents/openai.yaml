interface:
  display_name: "Workflow Implementation"
  short_description: "Direct coding execution workflow"
  default_prompt: "Use $workflow-implementation to implement the complete requested behavior through one canonical internal contract, prefer direct concrete code and composition over speculative indirection, honor explicit paradigm choices at their owning boundaries, and verify the actual path."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: true
  may_own_execution: true

work_horizon:
  level: cross_horizon
  role: direct_implementation_owner

execution_mode:
  kind: implementation_execution
  owns_execution: true

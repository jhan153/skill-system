interface:
  display_name: "Workflow Source Maintenance"
  short_description: "Prune obsolete source or synchronize code comments"
  default_prompt: "Use $workflow-source-maintenance in source_prune mode for proven-obsolete code or comment_sync mode for behavior-preserving comment/docstring maintenance. Keep live restructuring, feature work, and concrete bug repair with their own owners."

policy:
  invocation_surface: explicit_procedure
  allow_implicit_invocation: true
  may_own_execution: true

work_horizon:
  level: cross_horizon
  role: source_maintenance_owner

execution_mode:
  kind: source_maintenance_execution
  owns_execution: true

schema_version: 10
canonical_root: source

skill_distribution:
  mode: plugins_only
  canonical_root: source/skills
  runtime_skill_mirrors: retired
  providers:
    codex:
      package_pattern: plugins/{plugin}/skills
      marketplace: .agents/plugins/marketplace.json
    claude:
      package_pattern: plugins/claude/{plugin}/skills
      marketplace: plugins/.claude-plugin/marketplace.json
    grok:
      package_pattern: plugins/claude/{plugin}/skills
      manifest_pattern: plugins/claude/{plugin}/plugin.json
      install: grok plugin install <package-root>
      compatibility: claude_code
    antigravity:
      package_pattern: plugins/claude/{plugin}/skills
      manifest_pattern: plugins/claude/{plugin}/plugin.json
      install: agy plugin install <package-root>

plugin_profiles:
  - id: skill-system-core
    purpose: shared planning, management, evidence, execution assurance, and report delivery
  - id: skill-system-dev
    purpose: engineering analysis, architecture design, and implementation workflows
  - id: skill-system-design
    purpose: UI design creation, implementation, and design evidence
  - id: skill-system-research
    purpose: research-stage execution and paper evidence
  - id: skill-system-testing
    purpose: human-in-loop test decisions, test design, test-only implementation, and test evidence

shared_plugin_payloads:
  report_canvas:
    owner: skill-system-core
    canonical: source/shared/report-canvas
    generated_target: shared/report-canvas
    physical_package_sets: 2
    copies_per_physical_package: 1

runtime_companions:
  codex:
    root: .codex
    files:
      - AGENTS.md
      - context-routing.md
      - hooks.json
      - rules/skill-system.rules
      - docs/
      - schemas/
      - harness/README.md
      - harness/config.toml.fragment
      - bin/skill-system-harness
      - bin/skill-system-harness.exe
      - bin/skill-system-notify-overlay
  claude:
    root: .claude
    files:
      - CLAUDE.md
      - context-routing.md
      - hooks/settings.example.json
      - hooks/README.md
      - docs/
      - schemas/
      - bin/skill-system-claude-harness
      - bin/skill-system-claude-harness.exe
      - bin/skill-system-claude-harness-linux-amd64
      - bin/skill-system-notify-overlay
  grok:
    root: .grok
    files:
      - AGENTS.md
      - harness.json
      - harness/README.md
      - docs/
      - schemas/
      - bin/skill-system-grok-harness
      - bin/skill-system-grok-harness.exe
      - bin/skill-system-grok-harness-linux-amd64
      - bin/skill-system-notify-overlay
    lifecycle_owner: orca
  antigravity:
    root: .antigravity
    install_root: <ANTIGRAVITY_GLOBAL_ROOT>
    files:
      - GEMINI.md
      - harness.json
      - harness/README.md
      - docs/
      - schemas/
      - bin/skill-system-antigravity-harness
      - bin/skill-system-antigravity-harness.exe
      - bin/skill-system-antigravity-harness-linux-amd64
      - bin/skill-system-notify-overlay
    lifecycle_owner: orca

provider_roles:
  packaging:
    - codex
    - claude
    - grok
    - antigravity
  native_harness:
    - codex
    - claude
  common_harness:
    - codex
    - claude
    - grok
    - antigravity
  rule_companion:
    - grok
    - antigravity
  orca_execution:
    - codex
    - claude
    - grok
    - antigravity

retired_payloads:
  - .codex/skills
  - .claude/skills
  - .codex/tools
  - .claude/tools
  - runtime Python validators
  - research-routing.md
  - eval/
  - TaskRun
  - LoopRun
  - WorkItem
  - Agent Run
  - lifecycle ledgers

generation:
  runtime: python3 source/tools/generate_targets.py --target runtime
  plugins: python3 source/tools/generate_targets.py --target plugins

validation:
  repository_contract_tests: 4
  harness_component_test_mode: provider_local
  per_skill_persistent_tests: 0
  automatic_all_suite_gate: false

# source/runtime-inventory.yaml
#
# Phase 0 deliverable of docs/plan/2026-06-29-skill-system-plugin-neutral-source.md.
# Classifies the current .codex / .claude runtime payload into neutral-source buckets.
#
# This file is HAND-AUTHORED classification input for the generator. It is NOT a
# generated target and must not carry a do-not-edit/checksum header.
#
# Evidence basis (2026-06-29, from skill-system/ root):
#   - 9.4.3: user work contracts, non-blocking continuation, Report Canvas,
#     implementation-understanding skills, and post-9.4.2 maintenance added
#   - 9.4.2: Knowledge relation/history and workflow guidance added; Research fixtures remain
#     source-only; public provenance ledger retired with release guards against reintroduction
#   - 9.3.4: skill bodies remain shared; Claude frontmatter projects explicit-only invocation
#   - diff -q  .codex/context-routing.md .claude/.. -> IDENTICAL
#   - shared docs generate verbatim; platform-owned overlays remain intentionally distinct
#   - diff -qr .codex/eval .claude/eval            -> only eval/eval-case.schema.json differs
#   - ls .codex (15 top-level) vs .claude (9 top-level)
#   - .codex/tools = 29 top-level files + tests/; generated Claude runtime has no tools root
#   - .gitignore excludes /docs/ /.github/ /.kanboard-plan/ /.kanboard-plan.yml

meta:
  plan: docs/plan/2026-06-29-skill-system-plugin-neutral-source.md
  phase: "0"
  basis: "diff -qr / ls of .codex and .claude (2026-06-29); see runtime-payload-policy.md"
  buckets:
    shared-neutral: "single neutral source; generated to BOTH .codex and .claude (verbatim, via overlay, or mirror-from-canonical)"
    codex-only: "Codex-platform runtime; no Claude equivalent intended"
    claude-only: "Claude-platform runtime; no Codex equivalent intended"
    maintainer-only: "bundle self-maintenance / CI assets; not part of per-platform end-user runtime parity"
    plugin-packageable: "destined for Phase 2 plugin packages (none classified yet at Phase 0)"
    local-only/ignored: "gitignored; never in release payload"
  generation_strategies:
    neutral-verbatim: "copy neutral source to both targets unchanged"
    mirror-from-canonical: "generate a Claude copy from shared canonical data with header + source_checksum"
    platform-projected: "copy one canonical skill body and inject only the host-native invocation metadata"
    platform-template: "neutral body + per-platform overlay produces divergent codex/claude output"
    codex-native: "lives only in the .codex target"
    claude-native: "lives only in the .claude target"
    tooling: "generator/CI machinery, not shipped per-platform runtime content"
    local-ignored: "not generated, not committed"
  confidence:
    confirmed: "backed by diff/ls evidence in this session"
    provisional: "bucket needs a content read or an explicit Phase 0 policy decision (see decision_needed / runtime-payload-policy.md)"

# ---------------------------------------------------------------------------
# shared-neutral: already mirrored -> neutral source seed + Phase 1a baseline
# ---------------------------------------------------------------------------
entries:
  - path: "skills/"
    present_in: [codex, claude]
    class: shared-neutral
    generation: platform-projected
    confidence: confirmed
    gap: none
    notes: "Canonical SKILL.md stays Codex-neutral. Codex receives agents/openai.yaml unchanged; Claude explicit-only skills receive disable-model-invocation: true in generated frontmatter."

  - path: "context-routing.md (codex) | context-routing.md (claude)"
    present_in: [codex, claude]
    class: platform-native
    generation: codex-native + claude-native
    confidence: confirmed
    gap: none
    notes: "Split in 9.3.1: Codex keeps the compact exception router; Claude keeps its 9.2.1 structured routing line. Both ship under one bundle identity."

  - path: "docs/"
    present_in: [codex, claude]
    class: shared-neutral
    generation: neutral-verbatim
    confidence: confirmed
    gap: none
    notes: "Shared contracts generate to both platforms; harness lifecycle and Agent Output documents are platform-owned overlays because Codex and Claude runtimes intentionally differ."

  - path: "skills/report-*/scripts/report-canvas/ + skills/report-*/references/report_canvas_contract.md"
    present_in: [codex, claude, report-skill plugins]
    class: shared-canonical + skill-local projection
    generation: derived per-report-skill payload
    confidence: confirmed
    gap: none
    notes: "One canonical shared report model, deterministic offline renderer, Oblivion/Hagoromo themes, examples, and pinned dependencies project into every report skill's supported scripts/references boundary. Installed report skills need no sibling plugin or runtime root; non-report skills carry no Canvas payload. Three.js is embedded only in rendered spatial artifacts."

  - path: "eval/"
    present_in: [codex, claude]
    class: shared-neutral
    generation: neutral-verbatim
    confidence: confirmed
    gap: none
    notes: "all identical except eval/eval-case.schema.json (mirror entry) and eval/observed-runs/ (fixtures, see maintainer)."

  - path: "eval/eval-case.schema.json"
    present_in: [codex, claude]
    class: shared-neutral
    generation: mirror-from-canonical
    confidence: confirmed
    gap: none
    notes: "already generated codex->claude by sync_generated_mirrors.py."

  # platform-variant root: one neutral body + per-platform overlay
  - path: "AGENTS.md (codex) | CLAUDE.md (claude)"
    present_in: [codex, claude]
    class: platform-native
    generation: codex-native + claude-native
    confidence: confirmed
    gap: none
    notes: "Independent platform-owned global instructions. Portable skills and contracts remain shared."

# ---------------------------------------------------------------------------
# claude-only
# ---------------------------------------------------------------------------
  - path: "bin/skill-system-claude-harness, bin/skill-system-claude-harness.exe, bin/skill-system-claude-harness-linux-amd64, bin/skill-system-notify-overlay"
    present_in: [claude]
    class: claude-only
    generation: tooling
    confidence: confirmed
    notes: "Generator cross-builds the Claude-native dispatcher for darwin/arm64, windows/amd64, and linux/amd64 and packages the macOS Swift overlay. It shares bounded core packages with Codex but owns Claude event normalization."

  - path: "hooks/README.md, hooks/settings.example.json"
    present_in: [claude]
    class: claude-only
    generation: claude-native
    confidence: confirmed
    notes: "Host-owned four-event exec-form registration template. Generation does not edit live Claude settings."

# ---------------------------------------------------------------------------
# codex-only platform runtime
# ---------------------------------------------------------------------------
  - path: "bin/skill-system-harness, bin/skill-system-harness.exe, bin/skill-system-notify-overlay"
    present_in: [codex]
    class: codex-only
    generation: tooling
    confidence: confirmed
    notes: "Generator cross-builds the Go dispatcher for darwin/arm64 and windows/amd64 with CGO disabled and precompiles the darwin/arm64 Swift/Cocoa notification overlay. Target machines need neither Go nor Swift tooling."

  - path: "hooks.json"
    present_in: [codex]
    class: codex-only
    generation: codex-native
    confidence: confirmed
    notes: "Sole base registration owner. POSIX invokes the Go binary directly; Windows uses a bounded cmd conditional to honor CODEX_HOME with the default fallback. Stop has a 12-second host timeout; plugins register no duplicate hooks."

  - path: "rules/default.rules"
    present_in: [codex]
    class: codex-only
    generation: codex-native
    confidence: provisional
    phase_1b_decision: "codex-only for v1; no Claude equivalent is generated."
    decision_rationale: "Codex rules are a Codex permission/rules format. Claude permission behavior is governed by its own settings/permission model, not this file."

# ---------------------------------------------------------------------------
# platform-variant tools (present in both but divergent, or shared deps)
# ---------------------------------------------------------------------------
  - path: "desktop notification runtime"
    present_in: [codex, claude]
    class: platform-native
    generation: codex-native + claude-native
    confidence: confirmed
    gap: none
    phase_1b_decision: "platform-native and independent."
    decision_rationale: "Both dispatchers reuse the Go redaction and OS notification package, while event mapping remains platform-native. Claude listens to native Notification types rather than inferring approval or input from Stop. Neither branch owns validation or Kanboard; Codex alone owns its active LoopRun branch. Kanboard separately uses one atomic pending lease per workspace and stamps only successful stable syncs."

  - path: "tools/requirements.txt"
    present_in: [codex]
    class: codex-only
    generation: codex-native
    confidence: provisional
    gap: missing-in-claude
    phase_1b_decision: "codex-only for v1."
    decision_rationale: "No runtime-logic tools are being made shared-neutral in v1 except schemas/docs. Claude does not need a Python dependency file for schemas-only parity."

# ---------------------------------------------------------------------------
# GAP candidates: codex runtime logic missing from claude (Phase 1b decision)
# Default bucket is codex-only until policy approves neutralization, because
# making these shared-neutral materially changes what the Claude runtime is.
# ---------------------------------------------------------------------------
  - path: "tools/ loop engine: init_loop_run.py, activate_loop_run.py, resume_loop_run.py, deactivate_loop_run.py, evaluate_loop_run.py, loop_policy.py"
    present_in: [codex]
    class: codex-only
    generation: codex-native
    confidence: provisional
    gap: missing-in-claude
    phase_1b_decision: "codex-only for v1."
    decision_rationale: "Moving the loop engine would materially expand the Claude runtime. Keep Codex as the primary loop runtime until there is explicit Claude-side runtime demand and validation."

  - path: "tools/task_ledger.py"
    present_in: [codex]
    class: codex-only
    generation: codex-native
    confidence: provisional
    gap: missing-in-claude
    phase_1b_decision: "codex-only explicit workflow runtime."
    decision_rationale: "TaskRun is independent of the removed Agent Run hook artifact and remains owned by workflow-task-ledger."

  - path: "schemas/ (harness, knowledge, loop, orchestration, task, tools, workitem)"
    present_in: [codex, claude]
    class: shared-neutral
    generation: neutral-verbatim
    confidence: confirmed
    gap: closed
    phase_1b_decision: "Portable active schemas remain shared-neutral. Removed Agent Run and lifecycle-ledger schemas are not regenerated into either platform."
    decision_rationale: "Schemas follow active owners. WorkItem's Codex example remains platform-specific; the removed Claude hook ledger schema is not regenerated."

  - path: "research-routing.md"
    present_in: [codex]
    class: codex-only
    generation: codex-native
    confidence: confirmed
    gap: none
    phase_1b_decision: "codex-only — CORRECTED from the recorded 'shared-neutral' after content inspection."
    decision_rationale: "research-routing.md references Codex-specific assets. The independently owned Claude context-routing.md does not import that file."

  - path: "harness/README.md"
    present_in: [codex]
    class: codex-only
    generation: codex-native
    confidence: confirmed
    gap: none
    phase_1b_decision: "codex-only — CORRECTED from the recorded 'shared-neutral' after content inspection."
    decision_rationale: "Documents the Go hook dispatcher and source/runtime boundary. Agent Run compatibility and diagnostic commands were removed."

# ---------------------------------------------------------------------------
# maintainer-only: bundle CI / self-maintenance, not platform runtime parity
# ---------------------------------------------------------------------------
  - path: "maintainer/fixtures/research-ledger/ (valid.yaml, research-ledger.schema.json)"
    present_in: [source]
    class: maintainer-only
    generation: tooling
    confidence: confirmed
    notes: "The repository research profile consumes this ledger fixture and schema directly from source/maintainer. They are not generated into .codex, .claude, or plugins; no skill, hook, or live-home runtime consumes CODEX_HOME/research."

  - path: "tools/verify_bundle.py"
    present_in: [codex]
    class: maintainer-only
    generation: tooling
    confidence: confirmed
    notes: "bundle gate; profiles core/integrations/execution/research/loop. Agent Output is no longer a Codex profile."

  - path: "tools/validate_*.py"
    present_in: [codex]
    class: maintainer-only
    generation: tooling
    confidence: confirmed
    notes: "validate_eval_cases, _loop_run, _research_ledger, _task_run, _work_item."

  - path: "tools/check_*.py"
    present_in: [codex]
    class: maintainer-only
    generation: tooling
    confidence: confirmed
    notes: "check_doc_freshness, _evidence_ledger, _execution_assurance, _invocation_surface_policy, _reference_targets, _release_identity, _tool_requirements, _work_horizon_policy (8)."

  - path: "tools/run_*.py"
    present_in: [codex]
    class: maintainer-only
    generation: tooling
    confidence: confirmed
    notes: "run_behavior_evals, run_validator_unit_tests, run_verification_pipeline (3)."

  - path: "tools/ analysis+report: analyze_context_surface.py, _validation.py"
    present_in: [codex]
    class: maintainer-only
    generation: tooling
    confidence: confirmed

  - path: "tools/sync_generated_mirrors.py"
    present_in: [codex]
    class: maintainer-only
    generation: tooling
    confidence: confirmed

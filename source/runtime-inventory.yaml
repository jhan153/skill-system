  - path: "tools/tests/"
    present_in: [codex]
    class: maintainer-only
    generation: tooling
    confidence: confirmed
    notes: "tool unit tests + fixtures."

  - path: "eval/observed-runs/"
    present_in: [codex, claude]
    class: maintainer-only
    generation: tooling
    confidence: confirmed
    notes: "Small validator fixtures may remain, but historical 9.1.x release replay packages and the synthetic harness comparison gate were removed."

# ---------------------------------------------------------------------------
# local-only / ignored
# ---------------------------------------------------------------------------
  - path: "docs/ , .github/ , .kanboard-plan/ , .kanboard-plan.yml"
    present_in: [local]
    class: local-only/ignored
    generation: local-ignored
    confidence: confirmed
    notes: "skill-system/.gitignore excludes these; the plan doc itself lives under the gitignored docs/. source/ is NOT under docs/ and is committed."

  - path: "**/.DS_Store , ._* , __MACOSX/ , Thumbs.db , __pycache__/ , *.py[cod] , .pytest_cache/ , .mypy_cache/ , .ruff_cache/"
    present_in: [local]
    class: local-only/ignored
    generation: local-ignored
    confidence: confirmed
    notes: "OS / build residue."

# ---------------------------------------------------------------------------
# Phase scoping derived from the above
# ---------------------------------------------------------------------------
phase_scope:
  phase_1a_regression_baseline:
    description: "Every confirmed committed path in .codex AND .claude must regenerate byte-identical from source. No content change."
    includes:
      - "all shared-neutral (incl. the eval-schema mirror and platform-template entries)"
      - "all codex-only and claude-only entries as-is"
      - "all maintainer-only entries as-is"
    excludes:
      - "local-only/ignored"
  phase_1b_gap_remediation:
    status: "DONE (applied to live; .codex byte-identical, .claude gained schemas/ only)"
    description: "Close real Claude mirror gaps. After content inspection, the only genuine shared gap was schema definitions; the other candidates were correct platform divergence, not gaps."
    applied:
      - "schemas/ -> shared-neutral: 24 definitions+examples generated to .claude (codex-only work-item.example.yaml kept out -> .claude/schemas=24, .codex/schemas=25, no .codex path leak)"
    corrected_after_content_inspection:
      - "research-routing.md -> codex-only (NOT shared): references codex-only/dangling assets (codex-research-lifecycle skill, .codex/references/...) -> would create a broken Claude doc"
      - "desktop notification -> shared Go OS core with platform-native event mapping; Claude uses Notification rather than Stop inference"
      - "harness/README.md -> codex-only (NOT shared): documents .codex/harness/ paths; Claude has its own hooks/README.md"
    decisions_recorded_codex_only_for_v1:
      - "loop engine tools, task_ledger.py, research/ ledger+schema, tools/requirements.txt, rules/default.rules"
    review_record: "Phase 1b claude diff = + .claude/schemas/ (24 files) only. Verified at that cut: .codex byte-identical, .claude/schemas had no .codex refs, and core/loop profiles passed. Post-cutover the gate (live==source) replaces a separate allowlist file."
